        <!--From Lecture-->
        <form id="contactForm">
            <div class="container mt-1 nameInfo">
                <div class="row justify-content-evenly">
                    <label class="col-1 me-5" for="name">Name:</label>
                    <input class="col-5" type="text" id="name" name="name" placeholder="First and Last Name">
                    <span class="error col-3" id="nameError"></span>
                </div>
            </div>

            <div class="container mt-1 emailInfo">
                <div class="row justify-content-evenly">
                    <label class="col-1 me-5" for="email">Email:</label>
                    <input class="col-5" type="text" id="email" name="email" placeholder="Email Address">
                    <span class="error col-3" id="emailError"></span>
                </div>
            </div>

            <div class="container mt-1 messageInfo">
                <div class="row justify-content-evenly">
                    <label class="col-1 me-5" for="message">Message:</label>
                    <textarea class="col-5" id="message" name="message" placeholder="Comments"></textarea>
                    <span class="error col-3" id="messageError"></span>
                </div>
            </div>

            <div class="position-relative">
            <button class="btn btn-outline-primary translate-middle-x position-absolute top-0 start-50 mt-3" type="submit" value="Submit">Submit</button>
            </div>
        </form>
    </main>
